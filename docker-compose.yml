services:
  bot:
    build: .
    container_name: babushka_aida
    restart: always
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      ADMIN_ID: ${ADMIN_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      MODEL: ${MODEL:-openai/gpt-4.1-mini}
      FALLBACK_MODEL: ${FALLBACK_MODEL:-openai/gpt-4.1-nano}
      OPENROUTER_TIMEOUT: ${OPENROUTER_TIMEOUT:-12}
    volumes:
      - ./data_db:/app/data_db
